<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 Kelime Tahmin · Sürekli Oyun</title>
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #fff;
        }
        .game-container {
            width: 100%;
            max-width: 820px;
            background: linear-gradient(145deg, #141a2b, #1a2140);
            border-radius: 48px;
            padding: 28px 24px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.04);
            backdrop-filter: blur(2px);
            position: relative;
        }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9d976, #f39b7b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header h1 span { font-size: 26px; -webkit-text-fill-color: initial; }
        .header .sub {
            font-size: 13px;
            color: #8892b0;
            background: rgba(255,255,255,0.05);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        /* ─── SETTINGS ─── */
        .settings {
            background: rgba(0,0,0,0.25);
            border-radius: 20px;
            padding: 14px 18px;
            margin-bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .settings label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #a8b2d1;
            font-weight: 500;
        }
        .settings input {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            padding: 6px 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            width: 80px;
            transition: 0.2s;
            font-family: inherit;
        }
        .settings input:focus {
            outline: none;
            border-color: #f9d976;
            box-shadow: 0 0 0 3px rgba(249,217,118,0.15);
        }
        .settings input[type="text"] {
            width: 110px;
        }
        .settings .hint {
            font-size: 11px;
            color: #5a6a8a;
            margin-left: -4px;
        }

        /* ─── SCOREBOARD ─── */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 22px;
        }
        .team-card {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 14px 18px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .team-card.active-team {
            border-color: #f9d976;
            box-shadow: 0 0 30px rgba(249,217,118,0.08);
            background: rgba(249,217,118,0.05);
        }
        .team-card.active-team::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(249,217,118,0.3), transparent);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .team-name {
            font-size: 15px;
            font-weight: 600;
            color: #a8b2d1;
            letter-spacing: 0.5px;
        }
        .team-score {
            font-size: 38px;
            font-weight: 800;
            line-height: 1.2;
            margin-top: 2px;
            transition: all 0.2s ease;
        }
        .team-card.team1 .team-score { color: #64ffda; }
        .team-card.team2 .team-score { color: #ff79c6; }
        .team-card .turn-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f9d976;
            background: rgba(249,217,118,0.12);
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 2px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .team-card.active-team .turn-badge { opacity: 1; }

        /* ─── STATS ─── */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #8892b0;
            padding: 0 4px;
        }
        .stats-bar .timer {
            font-weight: 700;
            font-size: 20px;
            color: #f9d976;
            font-variant-numeric: tabular-nums;
            min-width: 60px;
        }
        .stats-bar .timer.warning {
            color: #ff6b6b;
            animation: pulse 0.6s ease-in-out infinite alternate;
        }
        .stats-bar .word-counter {
            background: rgba(255,255,255,0.04);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.5; transform: scale(0.96); }
        }

        /* ─── WORD DISPLAY ─── */
        .word-display {
            background: rgba(0,0,0,0.35);
            border-radius: 28px;
            padding: 32px 16px;
            margin-bottom: 18px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
        }
        .word-display .word {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #f0f4ff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.25s ease;
            word-break: break-word;
            line-height: 1.2;
        }
        .word-display .word.hint {
            font-size: 28px;
            color: #8892b0;
            font-weight: 500;
        }
        .word-display .category-tag {
            font-size: 12px;
            color: #64ffda;
            background: rgba(100,255,218,0.08);
            padding: 2px 14px;
            border-radius: 40px;
            margin-top: 10px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(100,255,218,0.08);
        }
        .word-display .turn-label {
            font-size: 14px;
            color: #f9d976;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .word-display .empty-state {
            color: #4a5478;
            font-size: 18px;
            font-weight: 500;
        }

        /* ─── ACTION BUTTONS ─── */
        .action-buttons {
            display: flex;
            gap: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .action-buttons button {
            flex: 1;
            min-width: 110px;
            padding: 16px 12px;
            border: none;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        .action-buttons button:active { transform: scale(0.94); }
        .action-buttons button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-correct {
            background: linear-gradient(135deg, #00b894, #00a381);
            color: #fff;
            box-shadow: 0 6px 24px rgba(0,184,148,0.25);
        }
        .btn-correct:hover:not(:disabled) {
            box-shadow: 0 8px 32px rgba(0,184,148,0.4);
            transform: translateY(-2px);
        }
        .btn-correct:active:not(:disabled) { transform: scale(0.94) !important; }
        .btn-pass {
            background: linear-gradient(135deg, #636e72, #4a4f5a);
            color: #dfe6e9;
            box-shadow: 0 6px 24px rgba(0,0,0,0.2);
        }
        .btn-pass:hover:not(:disabled) {
            background: linear-gradient(135deg, #747d82, #5a5f6a);
            transform: translateY(-2px);
        }
        .btn-endturn {
            background: linear-gradient(135deg, #e17055, #d63031);
            color: #fff;
            box-shadow: 0 6px 24px rgba(214,48,49,0.2);
            flex: 0.6;
            min-width: 80px;
        }
        .btn-endturn:hover:not(:disabled) {
            box-shadow: 0 8px 32px rgba(214,48,49,0.35);
            transform: translateY(-2px);
        }
        .btn-start-turn {
            background: linear-gradient(135deg, #f9d976, #f39b7b);
            color: #141a2b;
            box-shadow: 0 6px 24px rgba(249,217,118,0.25);
            flex: 0.8;
            min-width: 140px;
        }
        .btn-start-turn:hover:not(:disabled) {
            box-shadow: 0 8px 32px rgba(249,217,118,0.4);
            transform: translateY(-2px);
        }

        /* ─── GAME CONTROLS ─── */
        .game-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .game-controls button {
            padding: 12px 32px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .btn-start {
            background: linear-gradient(135deg, #f9d976, #f39b7b);
            color: #141a2b;
            box-shadow: 0 6px 28px rgba(249,217,118,0.2);
        }
        .btn-start:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 40px rgba(249,217,118,0.3);
        }
        .btn-reset {
            background: rgba(255,255,255,0.06);
            color: #8892b0;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-reset:hover {
            background: rgba(255,255,255,0.10);
            color: #fff;
        }

        /* ─── POPUP / OVERLAY ─── */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .popup-overlay.show {
            display: flex;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .popup-box {
            background: #1a2140;
            border-radius: 40px;
            padding: 36px 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .popup-box .icon {
            font-size: 56px;
            margin-bottom: 6px;
        }
        .popup-box h2 {
            font-size: 28px;
            font-weight: 800;
            color: #f9d976;
            margin-bottom: 6px;
        }
        .popup-box p {
            color: #a8b2d1;
            font-size: 16px;
            margin-bottom: 22px;
        }
        .popup-box button {
            background: linear-gradient(135deg, #f9d976, #f39b7b);
            color: #141a2b;
            border: none;
            border-radius: 40px;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .popup-box button:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(249,217,118,0.3);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 600px) {
            .game-container { padding: 18px 14px 22px; border-radius: 32px; }
            .header h1 { font-size: 19px; }
            .header .sub { font-size: 11px; padding: 2px 10px; }
            .settings { flex-direction: column; align-items: stretch; gap: 10px; }
            .settings label { justify-content: space-between; }
            .settings input { width: 100% !important; max-width: 140px; }
            .team-card { padding: 10px 12px; }
            .team-score { font-size: 28px; }
            .team-name { font-size: 13px; }
            .word-display .word { font-size: 34px; }
            .word-display { padding: 22px 12px; min-height: 100px; }
            .action-buttons button { font-size: 15px; padding: 14px 10px; min-width: 80px; }
            .btn-endturn, .btn-start-turn { flex: 0.5; min-width: 60px; }
            .stats-bar { font-size: 12px; }
            .stats-bar .timer { font-size: 17px; }
            .game-controls button { padding: 10px 22px; font-size: 14px; }
            .popup-box { padding: 28px 20px; }
            .popup-box h2 { font-size: 24px; }
        }
        @media (max-width: 400px) {
            .scoreboard { flex-direction: column; gap: 8px; }
            .team-card { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; }
            .team-card .team-score { font-size: 24px; margin-top: 0; }
            .team-card .turn-badge { font-size: 8px; }
            .word-display .word { font-size: 28px; }
            .action-buttons { gap: 8px; }
            .action-buttons button { font-size: 13px; padding: 12px 6px; min-width: 60px; }
            .header h1 { font-size: 16px; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2d3658; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- POPUP (Süre Doldu) -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <div class="icon">⏰</div>
            <h2>Süre Doldu!</h2>
            <p id="popupMessage">Tur tamamlandı. Sıra diğer takımda.</p>
            <button id="popupButton">Tamam</button>
        </div>
    </div>

    <div class="game-container" id="app">
        <!-- HEADER -->
        <div class="header">
            <h1><span>🎵</span> Kelime Tahmin</h1>
            <span class="sub">♾️ sonsuz tur</span>
        </div>

        <!-- SETTINGS -->
        <div class="settings" id="settingsPanel">
            <label>
                ⏱ Süre (sn)
                <input type="number" id="timeInput" value="60" min="10" max="300" step="5" />
                <span class="hint">(10–300)</span>
            </label>
            <label>
                🟢 Takım 1
                <input type="text" id="team1NameInput" value="Takım 1" maxlength="20" />
            </label>
            <label>
                🟣 Takım 2
                <input type="text" id="team2NameInput" value="Takım 2" maxlength="20" />
            </label>
        </div>

        <!-- SCOREBOARD -->
        <div class="scoreboard">
            <div class="team-card team1" id="team1Card">
                <div class="team-name" id="team1NameLabel">🟢 Takım 1</div>
                <div class="team-score" id="score1">0</div>
                <div class="turn-badge">🔵 SIRA</div>
            </div>
            <div class="team-card team2" id="team2Card">
                <div class="team-name" id="team2NameLabel">🟣 Takım 2</div>
                <div class="team-score" id="score2">0</div>
                <div class="turn-badge">🔵 SIRA</div>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-bar">
            <span class="timer" id="timerDisplay">⏱ 60</span>
            <span class="word-counter" id="wordCounter">📖 0 / 0</span>
        </div>

        <!-- WORD DISPLAY -->
        <div class="word-display" id="wordDisplay">
            <div class="turn-label" id="turnLabel">🔵 Hazır mısınız?</div>
            <div class="word" id="wordText">Başlamak için</div>
            <div class="category-tag" id="categoryTag">🎯 oyuna basla</div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-buttons">
            <button class="btn-correct" id="btnCorrect" disabled>✅ Doğru</button>
            <button class="btn-pass" id="btnPass" disabled>⏭ Geç</button>
            <button class="btn-endturn" id="btnEndTurn" disabled>⏹ Turu Bitir</button>
            <button class="btn-start-turn" id="btnStartTurn" disabled>▶️ Tur Başlasın</button>
        </div>

        <!-- CONTROLS -->
        <div class="game-controls">
            <button class="btn-start" id="btnStart">🚀 OYUNU BAŞLAT</button>
            <button class="btn-reset" id="btnReset">⟳ Sıfırla</button>
        </div>
    </div>

            'lokanta','kafe','bar','pastane','market','alışveriş merkezi'

        // ─ Kategori eşleştirme (görsellik)
        const CATEGORY_MAP = {
            'köpek':'🐾 Hayvan','kedi':'🐾 Hayvan','kuş':'🐾 Hayvan',
            'elma':'🍎 Meyve','armut':'🍎 Meyve','muz':'🍎 Meyve',
            'domates':'🥗 Sebze','salatalık':'🥗 Sebze','biber':'🥗 Sebze',
            'doktor':'💼 Meslek','hemşire':'💼 Meslek','avukat':'💼 Meslek',
            'masa':'🏠 Ev','sandalye':'🏠 Ev','koltuk':'🏠 Ev',
            'ekmek':'🍞 Yiyecek','pide':'🍞 Yiyecek','simit':'🍞 Yiyecek',
            'su':'🥤 İçecek','çay':'🥤 İçecek','kahve':'🥤 İçecek',
            'futbol':'⚽ Spor','basketbol':'⚽ Spor','yüzme':'⚽ Spor',
            'kırmızı':'🎨 Renk','mavi':'🎨 Renk','yeşil':'🎨 Renk',
            'baş':'🦴 Vücut','göz':'🦴 Vücut','burun':'🦴 Vücut',
            'mont':'👕 Giyim','ceket':'👕 Giyim','gömlek':'👕 Giyim',
            'araba':'🚗 Taşıt','kamyon':'🚗 Taşıt','otobüs':'🚗 Taşıt',
            'orman':'🌿 Doğa','ağaç':'🌿 Doğa','çiçek':'🌿 Doğa',
            'mutluluk':'💖 Duygu','üzüntü':'💖 Duygu','öfke':'💖 Duygu',
            'yürümek':'🏃 Fiil','koşmak':'🏃 Fiil','zıplamak':'🏃 Fiil',
            'büyük':'📐 Sıfat','küçük':'📐 Sıfat','uzun':'📐 Sıfat',
        };
        function getCategory(word) { return CATEGORY_MAP[word] || '🎯 Kelime'; }

        // ═══════════════════════════════════════════════════════════════
        //  2.  OYUN DURUMU
        // ═══════════════════════════════════════════════════════════════

        const state = {
            currentIndex: 0,
            team1Score: 0,
            team2Score: 0,
            currentTeam: 1,
            isPlaying: false,
            isTurnActive: false,      // süre aktif mi?
            isWaitingForStart: false, // tur başlamayı bekliyor mu?
            timer: null,
            timeLeft: 60,
            maxTime: 60,
            turnWords: [],
            totalWords: 0,
            team1Name: 'Takım 1',
            team2Name: 'Takım 2',
            popupShown: false,        // popup açık mı?
        };

        // ═══════════════════════════════════════════════════════════════
        //  3.  DOM REFERANSLARI
        // ═══════════════════════════════════════════════════════════════

        const $ = id => document.getElementById(id);
        const score1El = $('score1');
        const score2El = $('score2');
        const team1Card = $('team1Card');
        const team2Card = $('team2Card');
        const team1NameLabel = $('team1NameLabel');
        const team2NameLabel = $('team2NameLabel');
        const wordText = $('wordText');
        const categoryTag = $('categoryTag');
        const turnLabel = $('turnLabel');
        const timerDisplay = $('timerDisplay');
        const wordCounter = $('wordCounter');
        const btnCorrect = $('btnCorrect');
        const btnPass = $('btnPass');
        const btnEndTurn = $('btnEndTurn');
        const btnStartTurn = $('btnStartTurn');
        const btnStart = $('btnStart');
        const btnReset = $('btnReset');
        const timeInput = $('timeInput');
        const team1NameInput = $('team1NameInput');
        const team2NameInput = $('team2NameInput');
        const popupOverlay = $('popupOverlay');
        const popupMessage = $('popupMessage');
        const popupButton = $('popupButton');

        // ═══════════════════════════════════════════════════════════════
        //  4.  YARDIMCI FONKSİYONLAR
        // ═══════════════════════════════════════════════════════════════

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length-1; i>0; i--) {
                const j = Math.floor(Math.random()*(i+1));
                [a[i],a[j]] = [a[j],a[i]];
            }
            return a;
        }
        function getRandomWords(count) {
            const shuffled = shuffle(WORD_POOL);
            return shuffled.slice(0, count);
        }
        function formatTime(seconds) {
            return Math.max(0, Math.ceil(seconds));
        }

        function loadSettings() {
            let t = parseInt(timeInput.value, 10);
            if (isNaN(t) || t < 10) t = 60;
            if (t > 300) t = 300;
            timeInput.value = t;
            state.maxTime = t;
            state.timeLeft = t;

            const t1 = team1NameInput.value.trim() || 'Takım 1';
            const t2 = team2NameInput.value.trim() || 'Takım 2';
            state.team1Name = t1;
            state.team2Name = t2;
            team1NameLabel.textContent = `🟢 ${t1}`;
            team2NameLabel.textContent = `🟣 ${t2}`;
        }

        // ═══════════════════════════════════════════════════════════════
        //  5.  OYUN FONKSİYONLARI
        // ═══════════════════════════════════════════════════════════════

        function updateUI() {
            score1El.textContent = state.team1Score;
            score2El.textContent = state.team2Score;

            team1Card.classList.toggle('active-team', state.currentTeam === 1);
            team2Card.classList.toggle('active-team', state.currentTeam === 2);

            // Butonlar
            const canAct = state.isPlaying && state.isTurnActive && !state.isWaitingForStart && !state.popupShown;
            btnCorrect.disabled = !canAct || state.currentIndex >= state.turnWords.length;
            btnPass.disabled = !canAct || state.currentIndex >= state.turnWords.length;
            btnEndTurn.disabled = !canAct;

            // Tur başlat butonu: sadece bekleme modunda ve oyun aktifken
            btnStartTurn.disabled = !(state.isPlaying && state.isWaitingForStart && !state.popupShown);

            // Kelime gösterimi
            const teamName = state.currentTeam === 1 ? state.team1Name : state.team2Name;

            if (state.isPlaying && state.isTurnActive && state.currentIndex < state.turnWords.length) {
                const word = state.turnWords[state.currentIndex];
                wordText.textContent = word;
                wordText.className = 'word';
                categoryTag.textContent = getCategory(word);
                turnLabel.textContent = `🟢 ${teamName} açıklıyor...`;
            } else if (state.isPlaying && state.isWaitingForStart) {
                wordText.textContent = `⏳ ${teamName} hazır!`;
                wordText.className = 'word hint';
                categoryTag.textContent = '▶️ Tur başlasın';
                turnLabel.textContent = `🔵 Sıra ${teamName}'de`;
            } else if (state.isPlaying && state.isTurnActive && state.currentIndex >= state.turnWords.length) {
                wordText.textContent = '🎉 Tüm kelimeler tamam!';
                wordText.className = 'word hint';
                categoryTag.textContent = '✅ Tur bitti';
                turnLabel.textContent = `🏁 ${teamName} hazır!`;
                btnCorrect.disabled = true;
                btnPass.disabled = true;
            } else if (!state.isPlaying) {
                wordText.textContent = '🎯 Başlamak için';
                wordText.className = 'word hint';
                categoryTag.textContent = '🚀 oyuna basla';
                turnLabel.textContent = '🔵 Hazır mısınız?';
            } else {
                // ara durum
                wordText.textContent = '⏳ Bekleyin...';
                wordText.className = 'word hint';
                categoryTag.textContent = '⏳';
                turnLabel.textContent = '⏳';
            }

            // Timer
            timerDisplay.textContent = `⏱ ${formatTime(state.timeLeft)}`;
            timerDisplay.classList.toggle('warning', state.timeLeft <= 10 && state.isTurnActive && !state.isWaitingForStart);

            // Kelime sayacı
            const total = state.turnWords.length;
            const current = Math.min(state.currentIndex + 1, total);
            wordCounter.textContent = `📖 ${total > 0 ? current : 0} / ${total}`;
        }

        // ─ Popup göster ─
        function showPopup(message) {
            state.popupShown = true;
            popupMessage.textContent = message || 'Süre doldu! Sıra diğer takımda.';
            popupOverlay.classList.add('show');
            updateUI();
        }

        function hidePopup() {
            popupOverlay.classList.remove('show');
            state.popupShown = false;
            // Popup kapatıldıktan sonra sırayı geç
            if (state.isPlaying) {
                // Eğer turn aktif değilse zaten beklemededir, ama süre dolduysa turn aktif olabilir.
                // Her durumda sırayı geçelim ve bekleme moduna alalım.
                stopTimer();
                state.isTurnActive = false;
                state.isWaitingForStart = true;
                // Yeni takım ve kelimeler hazırlanır
                prepareNextTeam();
                updateUI();
            }
        }

        // ─ Sıradaki takımı hazırla (kelimeleri yenile, bekleme modu) ─
        function prepareNextTeam() {
            // Takımı değiştir
            state.currentTeam = state.currentTeam === 1 ? 2 : 1;
            state.currentIndex = 0;
            const raw = getRandomWords(20);
            state.turnWords = raw;
            state.totalWords = raw.length;
            state.timeLeft = state.maxTime;
            state.isTurnActive = false;
            state.isWaitingForStart = true;
            updateUI();
        }

        // ─ Turu başlat (süreyi başlat) ─
        function startTurnTimer() {
            if (!state.isPlaying || !state.isWaitingForStart || state.popupShown) return;

            state.isWaitingForStart = false;
            state.isTurnActive = true;
            state.timeLeft = state.maxTime;

            stopTimer();
            state.timer = setInterval(() => {
                state.timeLeft -= 0.3;
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    updateUI();
                    // Süre bitti, popup göster
                    const teamName = state.currentTeam === 1 ? state.team1Name : state.team2Name;
                    showPopup(`⏰ Süre doldu! ${teamName} turunu tamamladı.`);
                    // Timer durdurulur, popup kapanınca sıra geçer
                } else {
                    updateUI();
                }
            }, 300);

            updateUI();
        }

        // ─ Oyunu başlat (ilk tur) ─
        function startGame() {
            stopTimer();
            state.team1Score = 0;
            state.team2Score = 0;
            state.currentTeam = 1;
            state.currentIndex = 0;
            state.isPlaying = true;
            state.isTurnActive = false;
            state.isWaitingForStart = true;
            state.popupShown = false;
            popupOverlay.classList.remove('show');

            loadSettings();

            const raw = getRandomWords(20);
            state.turnWords = raw;
            state.totalWords = raw.length;
            state.timeLeft = state.maxTime;

            btnStart.textContent = '⏳ Oynanıyor...';
            btnStart.disabled = true;
            updateUI();
        }

        // ─ Doğru tahmin ─
        function correctGuess() {
            if (!state.isPlaying || !state.isTurnActive || state.isWaitingForStart || state.popupShown) return;
            if (state.currentIndex >= state.turnWords.length) return;

            if (state.currentTeam === 1) state.team1Score += 1;
            else state.team2Score += 1;

            state.currentIndex += 1;

            if (state.currentIndex >= state.turnWords.length) {
                // Tüm kelimeler bitti, turu bitir
                stopTimer();
                state.isTurnActive = false;
                const teamName = state.currentTeam === 1 ? state.team1Name : state.team2Name;
                showPopup(`🎉 ${teamName} tüm kelimeleri tamamladı!`);
                // Popup kapanınca sıra geçer
            } else {
                updateUI();
            }
        }

        // ─ Geç ─
        function passWord() {
            if (!state.isPlaying || !state.isTurnActive || state.isWaitingForStart || state.popupShown) return;
            if (state.currentIndex >= state.turnWords.length) return;

            state.currentIndex += 1;
            if (state.currentIndex >= state.turnWords.length) {
                stopTimer();
                state.isTurnActive = false;
                const teamName = state.currentTeam === 1 ? state.team1Name : state.team2Name;
                showPopup(`🎉 ${teamName} tüm kelimeleri tamamladı!`);
            } else {
                updateUI();
            }
        }

        // ─ Turu manuel bitir ─
        function endTurnManually() {
            if (!state.isPlaying || !state.isTurnActive || state.isWaitingForStart || state.popupShown) return;
            stopTimer();
            state.isTurnActive = false;
            const teamName = state.currentTeam === 1 ? state.team1Name : state.team2Name;
            showPopup(`⏹ ${teamName} turu manuel bitirdi.`);
        }

        function stopTimer() {
            if (state.timer) {
                clearInterval(state.timer);
                state.timer = null;
            }
        }

        // ─ Sıfırla ─
        function resetGame() {
            stopTimer();
            state.isPlaying = false;
            state.isTurnActive = false;
            state.isWaitingForStart = false;
            state.popupShown = false;
            popupOverlay.classList.remove('show');
            state.team1Score = 0;
            state.team2Score = 0;
            state.currentTeam = 1;
            state.currentIndex = 0;
            state.turnWords = [];
            state.totalWords = 0;
            loadSettings();
            state.timeLeft = state.maxTime;

            btnStart.textContent = '🚀 OYUNU BAŞLAT';
            btnStart.disabled = false;
            btnCorrect.disabled = true;
            btnPass.disabled = true;
            btnEndTurn.disabled = true;
            btnStartTurn.disabled = true;

            wordText.textContent = 'Başlamak için';
            wordText.className = 'word hint';
            categoryTag.textContent = '🎯 oyuna basla';
            turnLabel.textContent = '🔵 Hazır mısınız?';
            timerDisplay.textContent = `⏱ ${state.maxTime}`;
            timerDisplay.classList.remove('warning');
            wordCounter.textContent = '📖 0 / 0';

            team1NameLabel.textContent = `🟢 ${state.team1Name}`;
            team2NameLabel.textContent = `🟣 ${state.team2Name}`;
            updateUI();
        }

        // ═══════════════════════════════════════════════════════════════
        //  6.  OLAY DİNLEYİCİLER
        // ═══════════════════════════════════════════════════════════════

        btnStart.addEventListener('click', () => {
            if (!state.isPlaying) {
                startGame();
            }
        });

        btnReset.addEventListener('click', resetGame);

        btnCorrect.addEventListener('click', correctGuess);
        btnPass.addEventListener('click', passWord);
        btnEndTurn.addEventListener('click', endTurnManually);

        btnStartTurn.addEventListener('click', startTurnTimer);

        popupButton.addEventListener('click', hidePopup);

        // Ayar inputları (sadece oyun durmadığında etkili)
        team1NameInput.addEventListener('input', () => {
            if (!state.isPlaying) {
                const val = team1NameInput.value.trim() || 'Takım 1';
                state.team1Name = val;
                team1NameLabel.textContent = `🟢 ${val}`;
            }
        });
        team2NameInput.addEventListener('input', () => {
            if (!state.isPlaying) {
                const val = team2NameInput.value.trim() || 'Takım 2';
                state.team2Name = val;
                team2NameLabel.textContent = `🟣 ${val}`;
            }
        });
        timeInput.addEventListener('change', () => {
            let t = parseInt(timeInput.value, 10);
            if (isNaN(t) || t < 10) t = 60;
            if (t > 300) t = 300;
            timeInput.value = t;
            if (!state.isPlaying) {
                state.maxTime = t;
                state.timeLeft = t;
                timerDisplay.textContent = `⏱ ${t}`;
            }
        });

        // Klavye kısayolları
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Enter') {
                if (!btnCorrect.disabled) btnCorrect.click();
            } else if (e.key === 'ArrowLeft' || e.key === ' ') {
                e.preventDefault();
                if (!btnPass.disabled) btnPass.click();
            } else if (e.key === 'e' || e.key === 'E') {
                if (!btnEndTurn.disabled) btnEndTurn.click();
            } else if (e.key === 's' || e.key === 'S') {
                if (!btnStartTurn.disabled) btnStartTurn.click();
            } else if (e.key === 'r' || e.key === 'R') {
                if (!btnStart.disabled) btnStart.click();
            }
        });

        // ═══════════════════════════════════════════════════════════════
        //  7.  BAŞLANGIÇ
        // ═══════════════════════════════════════════════════════════════

        resetGame();
        console.log(`🎵 Kelime Tahmin · Sonsuz Tur · ${WORD_POOL.length} kelime yüklendi.`);
        console.log('Kısayollar: → Doğru, ← Geç, E Turu Bitir, S Tur Başlasın, R Oyunu Başlat');
    </script>
