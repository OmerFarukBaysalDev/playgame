<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 Kelime Tahmin Oyunu</title>
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #fff;
        }

        /* ─── CONTAINER ─── */
        .game-container {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(145deg, #141a2b, #1a2140);
            border-radius: 48px;
            padding: 28px 24px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(2px);
            transition: all 0.3s ease;
        }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9d976, #f39b7b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header h1 span {
            font-size: 26px;
            -webkit-text-fill-color: initial;
        }
        .header .sub {
            font-size: 13px;
            color: #8892b0;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.3px;
        }

        /* ─── SCOREBOARD ─── */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 22px;
        }
        .team-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 14px 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .team-card.active-team {
            border-color: #f9d976;
            box-shadow: 0 0 30px rgba(249, 217, 118, 0.08);
            background: rgba(249, 217, 118, 0.05);
        }
        .team-card.active-team::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(249, 217, 118, 0.3), transparent);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .team-name {
            font-size: 15px;
            font-weight: 600;
            color: #a8b2d1;
            letter-spacing: 0.5px;
        }
        .team-score {
            font-size: 38px;
            font-weight: 800;
            line-height: 1.2;
            margin-top: 2px;
            transition: all 0.2s ease;
        }
        .team-card.team1 .team-score {
            color: #64ffda;
        }
        .team-card.team2 .team-score {
            color: #ff79c6;
        }
        .team-card .turn-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f9d976;
            background: rgba(249, 217, 118, 0.12);
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 2px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .team-card.active-team .turn-badge {
            opacity: 1;
        }

        /* ─── TIMER & WORD COUNT ─── */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #8892b0;
            padding: 0 4px;
        }
        .stats-bar .timer {
            font-weight: 700;
            font-size: 20px;
            color: #f9d976;
            font-variant-numeric: tabular-nums;
            min-width: 60px;
        }
        .stats-bar .timer.warning {
            color: #ff6b6b;
            animation: pulse 0.6s ease-in-out infinite alternate;
        }
        .stats-bar .word-counter {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0.5;
                transform: scale(0.96);
            }
        }

        /* ─── WORD DISPLAY ─── */
        .word-display {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 28px;
            padding: 32px 16px;
            margin-bottom: 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
        }
        .word-display .word {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #f0f4ff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
            word-break: break-word;
            line-height: 1.2;
        }
        .word-display .word.hint {
            font-size: 28px;
            color: #8892b0;
            font-weight: 500;
        }
        .word-display .category-tag {
            font-size: 12px;
            color: #64ffda;
            background: rgba(100, 255, 218, 0.08);
            padding: 2px 14px;
            border-radius: 40px;
            margin-top: 10px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(100, 255, 218, 0.08);
        }
        .word-display .turn-label {
            font-size: 14px;
            color: #f9d976;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .word-display .empty-state {
            color: #4a5478;
            font-size: 18px;
            font-weight: 500;
        }

        /* ─── BUTTONS ─── */
        .action-buttons {
            display: flex;
            gap: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .action-buttons button {
            flex: 1;
            min-width: 110px;
            padding: 16px 12px;
            border: none;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        .action-buttons button:active {
            transform: scale(0.94);
        }
        .action-buttons button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-correct {
            background: linear-gradient(135deg, #00b894, #00a381);
            color: #fff;
            box-shadow: 0 6px 24px rgba(0, 184, 148, 0.25);
        }
        .btn-correct:hover:not(:disabled) {
            box-shadow: 0 8px 32px rgba(0, 184, 148, 0.4);
            transform: translateY(-2px);
        }
        .btn-correct:active:not(:disabled) {
            transform: scale(0.94) !important;
        }

        .btn-pass {
            background: linear-gradient(135deg, #636e72, #4a4f5a);
            color: #dfe6e9;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
        }
        .btn-pass:hover:not(:disabled) {
            background: linear-gradient(135deg, #747d82, #5a5f6a);
            transform: translateY(-2px);
        }

        .btn-endturn {
            background: linear-gradient(135deg, #e17055, #d63031);
            color: #fff;
            box-shadow: 0 6px 24px rgba(214, 48, 49, 0.2);
            flex: 0.6;
            min-width: 80px;
        }
        .btn-endturn:hover:not(:disabled) {
            box-shadow: 0 8px 32px rgba(214, 48, 49, 0.35);
            transform: translateY(-2px);
        }

        /* ─── START / RESET ─── */
        .game-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .game-controls button {
            padding: 12px 32px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .btn-start {
            background: linear-gradient(135deg, #f9d976, #f39b7b);
            color: #141a2b;
            box-shadow: 0 6px 28px rgba(249, 217, 118, 0.2);
        }
        .btn-start:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 40px rgba(249, 217, 118, 0.3);
        }
        .btn-reset {
            background: rgba(255, 255, 255, 0.06);
            color: #8892b0;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.10);
            color: #fff;
        }

        /* ─── WINNER OVERLAY ─── */
        .winner-overlay {
            display: none;
            text-align: center;
            padding: 18px 12px 8px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.3);
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .winner-overlay.show {
            display: block;
            animation: fadeSlideUp 0.6s ease;
        }
        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .winner-overlay .trophy {
            font-size: 48px;
            margin-bottom: 4px;
        }
        .winner-overlay .winner-text {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9d976, #f39b7b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .winner-overlay .winner-score {
            font-size: 16px;
            color: #8892b0;
            margin-top: 2px;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 600px) {
            .game-container {
                padding: 18px 14px 22px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 19px;
            }
            .header .sub {
                font-size: 11px;
                padding: 2px 10px;
            }
            .team-card {
                padding: 10px 12px;
            }
            .team-score {
                font-size: 28px;
            }
            .team-name {
                font-size: 13px;
            }
            .word-display .word {
                font-size: 34px;
            }
            .word-display {
                padding: 22px 12px;
                min-height: 100px;
            }
            .action-buttons button {
                font-size: 15px;
                padding: 14px 10px;
                min-width: 80px;
            }
            .btn-endturn {
                flex: 0.5;
                min-width: 60px;
            }
            .stats-bar {
                font-size: 12px;
            }
            .stats-bar .timer {
                font-size: 17px;
            }
            .game-controls button {
                padding: 10px 22px;
                font-size: 14px;
            }
            .winner-overlay .winner-text {
                font-size: 20px;
            }
        }
        @media (max-width: 400px) {
            .scoreboard {
                flex-direction: column;
                gap: 8px;
            }
            .team-card {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 14px;
            }
            .team-card .team-score {
                font-size: 24px;
                margin-top: 0;
            }
            .team-card .turn-badge {
                font-size: 8px;
            }
            .word-display .word {
                font-size: 28px;
            }
            .action-buttons {
                gap: 8px;
            }
            .action-buttons button {
                font-size: 13px;
                padding: 12px 6px;
                min-width: 60px;
            }
            .header h1 {
                font-size: 16px;
            }
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d3658;
            border-radius: 10px;
        }
    </style>
</head>

        // ─ Kategoriler (görsel zenginlik için) ─

            'elma': '🍎 Meyve', 'armut': '🍎 Meyve', 'muz': '🍎 Meyve',

            'masa': '🏠 Ev', 'sandalye': '🏠 Ev', 'koltuk': '🏠 Ev',
            'ekmek': '🍞 Yiyecek', 'pide': '🍞 Yiyecek', 'simit': '🍞 Yiyecek',
            'su': '🥤 İçecek', 'çay': '🥤 İçecek', 'kahve': '🥤 İçecek',
            'futbol': '⚽ Spor', 'basketbol': '⚽ Spor', 'yüzme': '⚽ Spor',
            'kırmızı': '🎨 Renk', 'mavi': '🎨 Renk', 'yeşil': '🎨 Renk',
            'baş': '🦴 Vücut', 'göz': '🦴 Vücut', 'burun': '🦴 Vücut',
            'mont': '👕 Giyim', 'ceket': '👕 Giyim', 'gömlek': '👕 Giyim',
            'araba': '🚗 Taşıt', 'kamyon': '🚗 Taşıt', 'otobüs': '🚗 Taşıt',
            'orman': '🌿 Doğa', 'ağaç': '🌿 Doğa', 'çiçek': '🌿 Doğa',
            'mutluluk': '💖 Duygu', 'üzüntü': '💖 Duygu', 'öfke': '💖 Duygu',
            'yürümek': '🏃 Fiil', 'koşmak': '🏃 Fiil', 'zıplamak': '🏃 Fiil',
            'büyük': '📐 Sıfat', 'küçük': '📐 Sıfat', 'uzun': '📐 Sıfat',
        };

        function getCategory(word) {
            return CATEGORY_MAP[word] || '🎯 Kelime';
        }

        // ═══════════════════════════════════════════════════════════════
        //  2.  OYUN DURUMU
        // ═══════════════════════════════════════════════════════════════

        const state = {
            words: [],
            currentIndex: 0,
            team1Score: 0,
            team2Score: 0,
            currentTeam: 1, // 1 veya 2
            isPlaying: false,
            isTurnActive: false,
            timer: null,
            timeLeft: 60,
            maxTime: 60,
            totalWords: 0,
            usedWords: [],
            turnWords: [],
            gameEnded: false,
        };

        // ═══════════════════════════════════════════════════════════════
        //  3.  DOM REFERANSLARI
        // ═══════════════════════════════════════════════════════════════

        const $ = (id) => document.getElementById(id);
        const score1El = $('score1');
        const score2El = $('score2');
        const team1Card = $('team1Card');
        const team2Card = $('team2Card');
        const wordText = $('wordText');
        const categoryTag = $('categoryTag');
        const turnLabel = $('turnLabel');
        const timerDisplay = $('timerDisplay');
        const wordCounter = $('wordCounter');
        const btnCorrect = $('btnCorrect');
        const btnPass = $('btnPass');
        const btnEndTurn = $('btnEndTurn');
        const btnStart = $('btnStart');
        const btnReset = $('btnReset');
        const winnerOverlay = $('winnerOverlay');
        const winnerText = $('winnerText');
        const winnerScore = $('winnerScore');

        // ═══════════════════════════════════════════════════════════════
        //  4.  YARDIMCI FONKSİYONLAR
        // ═══════════════════════════════════════════════════════════════

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getRandomWords(count) {
            const shuffled = shuffle(WORD_POOL);
            return shuffled.slice(0, count);
        }

        function formatTime(seconds) {
            return Math.max(0, Math.ceil(seconds));
        }

        // ═══════════════════════════════════════════════════════════════
        //  5.  OYUN FONKSİYONLARI
        // ═══════════════════════════════════════════════════════════════

        function updateUI() {
            // Skorlar
            score1El.textContent = state.team1Score;
            score2El.textContent = state.team2Score;

            // Aktif takım vurgusu
            team1Card.classList.toggle('active-team', state.currentTeam === 1);
            team2Card.classList.toggle('active-team', state.currentTeam === 2);

            // Buton durumları
            const canAct = state.isPlaying && state.isTurnActive && !state.gameEnded;
            btnCorrect.disabled = !canAct || state.currentIndex >= state.turnWords.length;
            btnPass.disabled = !canAct || state.currentIndex >= state.turnWords.length;
            btnEndTurn.disabled = !canAct;

            // Kelime gösterimi
            if (state.isPlaying && state.isTurnActive && state.currentIndex < state.turnWords.length) {
                const word = state.turnWords[state.currentIndex];
                wordText.textContent = word;
                wordText.className = 'word';
                categoryTag.textContent = getCategory(word);
                turnLabel.textContent = `🟢 ${state.currentTeam === 1 ? 'Takım 1' : 'Takım 2'} açıklıyor...`;
            } else if (state.isPlaying && state.isTurnActive && state.currentIndex >= state.turnWords.length) {
                wordText.textContent = '🎉 Tüm kelimeler tamam!';
                wordText.className = 'word hint';
                categoryTag.textContent = '✅ Tur bitti';
                turnLabel.textContent = `🏁 ${state.currentTeam === 1 ? 'Takım 1' : 'Takım 2'} hazır!`;
                btnCorrect.disabled = true;
                btnPass.disabled = true;
            } else if (state.gameEnded) {
                // kazanan overlay zaten gösteriliyor
            } else {
                wordText.textContent = state.isPlaying ? '⏳ Bekleyin...' : '🎯 Başlamak için';
                wordText.className = 'word hint';
                categoryTag.textContent = state.isPlaying ? '⏳' : '🎯 oyuna basla';
                turnLabel.textContent = state.isPlaying ? '⏳ Tur hazırlanıyor...' : '🔵 Hazır mısınız?';
            }

            // Timer
            timerDisplay.textContent = `⏱ ${formatTime(state.timeLeft)}`;
            timerDisplay.classList.toggle('warning', state.timeLeft <= 10 && state.isPlaying);

            // Kelime sayacı
            const total = state.turnWords.length;
            const current = Math.min(state.currentIndex + 1, total);
            wordCounter.textContent = `📖 ${total > 0 ? current : 0} / ${total}`;

            // Winner overlay
            if (state.gameEnded) {
                winnerOverlay.classList.add('show');
            } else {
                winnerOverlay.classList.remove('show');
            }
        }

        function startGame() {
            // Eski oyunu temizle
            stopTimer();
            state.gameEnded = false;
            state.team1Score = 0;
            state.team2Score = 0;
            state.currentTeam = 1;
            state.currentIndex = 0;
            state.isPlaying = true;
            state.isTurnActive = false;

            // 20 kelime hazırla (her takım için aynı havuzdan farklı sırada)
            const raw = getRandomWords(20);
            state.turnWords = raw;
            state.totalWords = raw.length;
            state.currentIndex = 0;
            state.timeLeft = state.maxTime;

            winnerOverlay.classList.remove('show');
            btnStart.textContent = '⏳ Oynanıyor...';
            btnStart.disabled = true;

            // İlk turu başlat
            startTurn();
        }

        function startTurn() {
            if (state.gameEnded) return;

            stopTimer();

            // Takım değişimi kontrolü
            // Eğer currentIndex tüm kelimeleri geçtiyse veya tur bitmişse
            if (state.currentIndex >= state.turnWords.length) {
                // Diğer takıma geç
                switchTeam();
                return;
            }

            state.isTurnActive = true;
            state.timeLeft = state.maxTime;

            // Timer'ı başlat
            state.timer = setInterval(() => {
                state.timeLeft -= 0.3;
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    updateUI();
                    // Süre doldu, turu bitir
                    endTurn();
                } else {
                    updateUI();
                }
            }, 300);

            updateUI();
        }

        function switchTeam() {
            state.currentTeam = state.currentTeam === 1 ? 2 : 1;
            state.currentIndex = 0;
            // Yeni kelime listesi hazırla (aynı havuzdan farklı sırada)
            const raw = getRandomWords(20);
            state.turnWords = raw;
            state.totalWords = raw.length;
            state.timeLeft = state.maxTime;
            state.isTurnActive = true;

            // Timer'ı yeniden başlat
            stopTimer();
            state.timer = setInterval(() => {
                state.timeLeft -= 0.3;
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    updateUI();
                    endTurn();
                } else {
                    updateUI();
                }
            }, 300);

            updateUI();
        }

        function correctGuess() {
            if (!state.isTurnActive || state.gameEnded) return;
            if (state.currentIndex >= state.turnWords.length) return;

            // Puan ekle
            if (state.currentTeam === 1) {
                state.team1Score += 1;
            } else {
                state.team2Score += 1;
            }

            // Sonraki kelime
            state.currentIndex += 1;

            // Kelimeler bitti mi?
            if (state.currentIndex >= state.turnWords.length) {
                // Tüm kelimeler bitti, turu bitir
                endTurn();
            } else {
                updateUI();
                // Timer sıfırlanmaz, devam eder
            }
        }

        function passWord() {
            if (!state.isTurnActive || state.gameEnded) return;
            if (state.currentIndex >= state.turnWords.length) return;

            // Geç, puan yok
            state.currentIndex += 1;

            if (state.currentIndex >= state.turnWords.length) {
                endTurn();
            } else {
                updateUI();
            }
        }

        function endTurn() {
            if (state.gameEnded) return;

            stopTimer();
            state.isTurnActive = false;
            updateUI();

            // Takım değiştir veya oyunu bitir
            if (state.currentTeam === 1) {
                // 1. takımın turu bitti, 2. takıma geç
                // Ama önce 1. takımın puanını kaydet
                state.currentTeam = 2;
                state.currentIndex = 0;
                // Yeni kelime listesi
                const raw = getRandomWords(20);
                state.turnWords = raw;
                state.totalWords = raw.length;
                state.timeLeft = state.maxTime;
                state.isTurnActive = true;

                stopTimer();
                state.timer = setInterval(() => {
                    state.timeLeft -= 0.3;
                    if (state.timeLeft <= 0) {
                        state.timeLeft = 0;
                        updateUI();
                        endTurn();
                    } else {
                        updateUI();
                    }
                }, 300);

                updateUI();
            } else {
                // 2. takımın turu bitti, oyun bitti
                endGame();
            }
        }

        function endGame() {
            stopTimer();
            state.isPlaying = false;
            state.isTurnActive = false;
            state.gameEnded = true;
            btnStart.textContent = '🔄 Tekrar Oyna';
            btnStart.disabled = false;

            // Kazananı belirle
            let winner = '';
            if (state.team1Score > state.team2Score) {
                winner = '🏆 Takım 1 Kazandı!';
            } else if (state.team2Score > state.team1Score) {
                winner = '🏆 Takım 2 Kazandı!';
            } else {
                winner = '🤝 Beraberlik!';
            }
            winnerText.textContent = winner;
            winnerScore.textContent = `Takım 1: ${state.team1Score}  |  Takım 2: ${state.team2Score}`;
            winnerOverlay.classList.add('show');

            // Kelime gösterimini güncelle
            wordText.textContent = '🏁 Oyun Bitti';
            wordText.className = 'word hint';
            categoryTag.textContent = '🎯 Tebrikler!';
            turnLabel.textContent = '🏆';

            updateUI();
        }

        function stopTimer() {
            if (state.timer) {
                clearInterval(state.timer);
                state.timer = null;
            }
        }

        function resetGame() {
            stopTimer();
            state.isPlaying = false;
            state.isTurnActive = false;
            state.gameEnded = false;
            state.team1Score = 0;
            state.team2Score = 0;
            state.currentTeam = 1;
            state.currentIndex = 0;
            state.timeLeft = state.maxTime;
            state.turnWords = [];
            state.totalWords = 0;

            winnerOverlay.classList.remove('show');
            btnStart.textContent = '🚀 OYUNU BAŞLAT';
            btnStart.disabled = false;
            btnCorrect.disabled = true;
            btnPass.disabled = true;
            btnEndTurn.disabled = true;

            wordText.textContent = 'Başlamak için';
            wordText.className = 'word hint';
            categoryTag.textContent = '🎯 oyuna basla';
            turnLabel.textContent = '🔵 Hazır mısınız?';
            timerDisplay.textContent = '⏱ 60';
            timerDisplay.classList.remove('warning');
            wordCounter.textContent = '📖 0 / 0';

            updateUI();
        }

        // ═══════════════════════════════════════════════════════════════
        //  6.  OLAY DİNLEYİCİLER
        // ═══════════════════════════════════════════════════════════════

        btnStart.addEventListener('click', () => {
            if (state.gameEnded) {
                resetGame();
                setTimeout(() => startGame(), 300);
            } else if (!state.isPlaying) {
                startGame();
            }
        });

        btnReset.addEventListener('click', resetGame);

        btnCorrect.addEventListener('click', correctGuess);

        btnPass.addEventListener('click', passWord);

        btnEndTurn.addEventListener('click', () => {
            if (state.isTurnActive && !state.gameEnded) {
                endTurn();
            }
        });

        // Klavye kısayolları
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Enter') {
                if (!btnCorrect.disabled) btnCorrect.click();
            } else if (e.key === 'ArrowLeft' || e.key === ' ') {
                e.preventDefault();
                if (!btnPass.disabled) btnPass.click();
            } else if (e.key === 'e' || e.key === 'E') {
                if (!btnEndTurn.disabled) btnEndTurn.click();
            } else if (e.key === 'r' || e.key === 'R') {
                if (!btnStart.disabled) btnStart.click();
            }
        });

        // ═══════════════════════════════════════════════════════════════
        //  7.  BAŞLANGIÇ
        // ═══════════════════════════════════════════════════════════════

        // Başlangıç durumu
        resetGame();

        // Konsola yardım
        console.log('🎵 Kelime Tahmin Oyunu');
        console.log('Kısayollar: → Doğru, ← Geç, E Turu Bitir, R Oyunu Başlat/Sıfırla');
        console.log(`📚 ${WORD_POOL.length} kelime yüklendi.`);
    </script>
